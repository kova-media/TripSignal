name: Fix map coordinates

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix stale coordinate precedence
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/trip-discovery.tsx')
          s = p.read_text()
          old = "const destinationCoordinates = destinationCoordinate ?? (destinationAirport ? airportCoordinates[destinationAirport] : undefined);\n  const originCoordinates = originCoordinate ?? (origin ? airportCoordinates[origin] : undefined);"
          new = "const destinationCoordinates = destinationAirport ? (airportCoordinates[destinationAirport] ?? destinationCoordinate) : destinationCoordinate;\n  const originCoordinates = origin ? (airportCoordinates[origin] ?? originCoordinate) : originCoordinate;"
          if old not in s:
              raise SystemExit('Expected coordinate logic not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/trip-discovery.tsx
          git diff --cached --quiet || git commit -m "Fix airport map coordinate precedence"
          git push
